<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <nav>
    <a href="index.html">Presentacion</a>
    <a href="formulario.html">Formulario</a>
 </nav>

 <section>
    <form action="https://httpbin.org/post" method="post">

 <h1>Formulario De Registro</h1>
    <hr>
    <h2>Datos Personales</h2>

    <p>
    <label for="Nombre"><strong>Nombre</strong></label>
    <input type="text" name="Nombre" placeholder=" Escribe su nombre" id="Nombre">
    </p>

    <p>
        <label for="Apellido"><strong>Apellido</strong></label>
        <input type="text"name="Apellido" placeholder="Escribe tu apellido" id="Apellido">
    </p>

    <p>
    <label for="No.Cedula"><strong>No. Cedula</strong></label>
    <input type="text" name="No.Cedula" placeholder=" Numero de identidad" id="No.Cedula">
    </p>

    <p>
    <label for="Fecha de nacimiento"><strong>Fecha de nacimiento</strong></label>
    <input type="date"name="Fecha de nacimiento"
     placeholder="fecha de Nacimiento" id="Fecha de nacimiento">
    <p>
        <label for="Nacionalidad"><strong>Nacionalidad</strong>
        <select name="Nacionalidad" id="Nacionalidad">
        <option value="Dom">Dominicana</option>
        <option value="EEUU">Estadounidense</option>
        <option value="PR">Portorriqueña</option>
        <option value="Hai">Haitiana</option>
        </select>

        <p>
          <label for="gender">Género</label>
          <input type="radio" name="gender" value="hombre" checked />Hombre
          <input type="radio" name="gender" value="mujer" />Mujer
        </p>

    <h2>Contacto</h2>

    <p>
    <label for="Numero de Telefono"><strong>No.Telefono</strong></label>
    <input type="text"name="Numero de telefono" placeholder="Numero de Telefono" 
      required id="Numero de Telefono">
    <p>
    
     <p>
    <label for="Correo"><strong>Correo</strong></label>
    <input type="email"name="Correo" placeholder="Correo" id="Correo">
    <p>
        <label for="password"><strong>Contraseña</strong></label>
          <input type="password"name="Contraseña" placeholder="Indica tu Contraseña"
            minlength="6" required ="Contraseña"> 
            <p>
    <label for="comentarios">Escribe tus comentarios:</label>
    <br>
    <textarea name="comentarios" id="comentarios"
              rows="5" cols="35"
              placeholder="Escribe aquí tus comentarios"></textarea>
      </p>

      <p>
    <input type="checkbox" name="acepta_condiciones"
           required="acepta_condiciones" value="si">
    <label for="acepta_condiciones"> 
        Acepto las condiciones del formulario.
    </label>
</p>

<p></p>
       <button type="submit"><h2>Enviar</h2></button>
        <button type="reset"><h2>Borrar Formulario</h2></button>
      </form>
    </section> 

</body>
</html>
